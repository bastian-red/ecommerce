# Local development infrastructure: Postgres, Redis, Mailhog (test SMTP).
# Usage: docker compose -f infra/docker-compose.yml up -d
#
# Ports are deliberately off the defaults. The dev host already runs a system
# PostgreSQL on 5432 and project001's stack on 5432/6379, so this project takes
# 5433/6380 and every URL in .env.example matches.
#
# `name` is explicit on purpose. Compose otherwise derives the project name from
# the containing directory, which is `infra` in every project of this portfolio,
# so two stacks would share one project name and evict each other's containers
# and volumes.
name: shop
services:
  postgres:
    image: postgres:16-alpine
    container_name: shop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shop -d shop']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shop-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6380:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: shop-mailhog
    restart: unless-stopped
    ports:
      - '1026:1025' # SMTP
      - '8026:8025' # web UI at http://localhost:8026

  # The application services are opt-in: `docker compose --profile app up -d`.
  # Day-to-day development runs them with `pnpm dev` for hot reload, and only
  # needs the datastores above. The profile exists so the whole stack can be
  # brought up exactly as it ships, which is what the deploy runs.
  api:
    profiles: ['app']
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: shop-api
    restart: unless-stopped
    # Secrets come from the repo-root .env, which Compose does not read on its
    # own (it looks beside the compose file). Listing it here keeps the values
    # out of this file and out of git.
    env_file: ../.env
    environment:
      # Container-network overrides. These win over the .env values above,
      # because inside the compose network the hosts are service names, not
      # localhost.
      DATABASE_URL: postgresql://shop:shop@postgres:5432/shop?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /data/uploads
      STORAGE_PUBLIC_URL: http://localhost:4000/media
      APP_BASE_URL: http://localhost:3000
      SMTP_HOST: mailhog
      SMTP_PORT: '1025'
      PORT: '4000'
    ports:
      - '4000:4000'
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://localhost:4000/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    profiles: ['app']
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        # Inlined into the browser bundle at build time, so it is an ARG rather
        # than a runtime variable.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    container_name: shop-web
    restart: unless-stopped
    env_file: ../.env
    environment:
      API_BASE_URL: http://api:4000
      APP_BASE_URL: http://localhost:3000
      HOSTNAME: 0.0.0.0
      PORT: '3000'
    ports:
      - '3000:3000'
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  uploads:
